name: MooBee Fetch CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests-and-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r services/api/requirements.txt pytest
      - name: Python and shell validation
        run: |
          python -m compileall -q services/api
          node --check services/api/static/app.js
          bash -n scripts/setup.sh
          bash -n scripts/test-egress-lab.sh
          sh -n services/downloader/egress-entrypoint.sh
      - name: Run tests
        run: pytest -q
      - name: Validate Compose (no secrets)
        env:
          FETCH_USERNAME: ci
          FETCH_PASSWORD: not-a-real-credential-placeholder-12345
          ARIA2_RPC_SECRET: not-a-real-credential-placeholder-23456
        run: |
          printf 'FETCH_USERNAME=%s\nFETCH_PASSWORD=%s\nARIA2_RPC_SECRET=%s\n' "$FETCH_USERNAME" "$FETCH_PASSWORD" "$ARIA2_RPC_SECRET" > .env
          docker compose config --quiet
          docker compose build web downloader
          FETCH_HOST_PUBLIC_IP=209.159.148.172 docker compose -f compose.yaml -f compose.egress.yaml config --quiet
          docker build -f services/downloader/Dockerfile.egress -t moobee-fetch-egress-ci services/downloader
          rm -f .env
      - name: Media preflight with synthetic local video
        run: |
          docker run --rm --read-only --tmpfs /tmp:rw,size=32m,mode=1777 \
            --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint /bin/sh moobee-fetch-web -ec '
              ffmpeg -v error -f lavfi -i color=c=black:s=64x64:r=1:d=1 \
                -c:v mpeg4 -y /tmp/control.mp4
              python -c "import os,probe; fd=os.open(\"/tmp/control.mp4\",os.O_RDONLY); print(probe.inspect_fd(fd)); os.close(fd)"
            '
      - name: Disposable network-isolation and synthetic-download smoke
        run: bash scripts/test-egress-lab.sh
